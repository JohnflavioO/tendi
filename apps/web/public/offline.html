<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Sem conexão · TendiDesk</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); background: #F5F6FB; color: #1E2046; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 360px; text-align: center; }
    img { height: 52px; width: auto; }
    .icon { margin: 40px auto 0; width: 64px; height: 64px; border-radius: 20px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px -12px rgba(47, 49, 107, .35); color: #2F316B; }
    h1 { margin-top: 22px; font-size: 20px; color: #25275B; }
    p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: #6B6F93; }
    button { margin-top: 28px; width: 100%; border: 0; border-radius: 14px; padding: 15px 18px; background: #004751; color: #fff; font: inherit; font-size: 16px; font-weight: 600; }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main>
    <img src="/brand/tendidesk-logo.png" alt="TendiDesk">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.39"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Você está sem internet</h1>
    <p>As conversas voltam a aparecer assim que a conexão retornar. Nenhuma mensagem é perdida.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
